<%#
LuCI Speedtest (speedtestpp) status page
%>
<%+header%>

<div class="cbi-map">
	<h2 name="content"><%:Speedtest (speedtestpp)%></h2>
	<div class="cbi-map-descr"><%:Run a broadband speed test against speedtest.net. Click "Start" then wait for the result.%></div>
</div>

<div class="cbi-section" style="margin-top:12px">
	<button id="st_start" class="cbi-button cbi-button-apply"><%:Start Speedtest%></button>
	<span id="st_state" style="margin-left:12px"></span>
</div>

<div class="cbi-section" id="st_box" style="display:none; margin-top:8px">
	<pre id="st_out" style="background:#111;color:#0f0;padding:10px;white-space:pre-wrap;word-break:break-all;"></pre>
</div>

<script type="text/javascript">
	var pollTimer = null;
	function poll() {
		XHR.get('<%=luci.dispatcher.build_url("admin/network/speedtestpp/status")%>', function(x, st) {
			var s = (x.responseText||'').trim();
			if (s.indexOf('running') === 0) {
				document.getElementById('st_state').textContent = '<%:Testing, please wait…%>';
			} else {
				clearInterval(pollTimer);
				document.getElementById('st_state').textContent = '<%:Done.%>';
				XHR.get('<%=luci.dispatcher.build_url("admin/network/speedtestpp/result")%>', function(x2, st2) {
					var out = document.getElementById('st_out');
					document.getElementById('st_box').style.display = 'block';
					out.textContent = x2.responseText || '(no result)';
				});
			}
		});
	}
	document.getElementById('st_start').addEventListener('click', function() {
		document.getElementById('st_box').style.display = 'block';
		document.getElementById('st_out').textContent = '<%:Starting…%>';
		XHR.get('<%=luci.dispatcher.build_url("admin/network/speedtestpp/start")%>', function() {
			document.getElementById('st_state').textContent = '<%:Testing, please wait…%>';
			pollTimer = setInterval(poll, 5000);
		});
	});
</script>

<%+footer%>
