name: Build ImmortalWrt (EdgeLink EL-953)

# 仓库已 vendor：主源码在仓库根，feeds 在 feeds-src/*，feeds.conf 用 src-link
# 这里只跑构建 + 收固件，不再 clone 任何外部仓库。
# 第一次需要先跑 .github/workflows/vendor.yml 生成 vendor 产物。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - 'README.md'
      - '.github/workflows/vendor.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: false  # 不需要 submodule，所有源码已 vendor 进仓库

      - name: Sanity: feeds.conf uses src-link
        run: |
          echo "=== feeds.conf ==="
          cat feeds.conf
          echo
          echo "=== feeds-src/ ==="
          ls -la feeds-src/

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev python3-distutils quilt cpio xxd

      - name: Update & install feeds (src-link, no network)
        run: |
          # src-link feeds 直接做 link，不需要 update
          ./scripts/feeds update -i
          ./scripts/feeds install -a

      - name: Place .config & apply device support
        run: |
          # device-add.sh 在 vendor 阶段已 baked 进源码树，
          # 这里只 .config 落位 + 触发一次 defconfig
          cp -n .config .config.built || true
          make defconfig

      - name: Download packages
        run: |
          make download -j$(nproc) || true

      - name: Build firmware
        run: |
          make -j$(nproc) V=s

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find bin/targets -type f \( -name "*.bin" -o -name "*.manifest" \) -print0 \
            | xargs -0 -I{} cp {} artifacts/ 2>/dev/null || true
          ls -la artifacts/ 2>/dev/null || echo "no artifacts"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-edgelink-el-953
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
