name: Build ImmortalWrt (ZBT WE826-Q)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  REPO_URL: https://github.com/Y0518/immortalwrt
  REPO_BRANCH: openwrt-21.02

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses5-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev \
            file wget libelf-dev python3-distutils quilt cpio xxd

      - name: Clone source
        run: |
          git clone --depth 1 -b ${{ env.REPO_BRANCH }} ${{ env.REPO_URL }} immortalwrt

      - name: Add zbt_we826-q device support
        run: |
          cp .config immortalwrt/.config
          bash patches/device-add.sh immortalwrt
          # add Y0518/modemfeed (we826q private pkg + modeminfo/atinout/wwan/etc)
          echo 'src-git modemfeed https://github.com/Y0518/modemfeed.git' >> immortalwrt/feeds.conf.default

      - name: Update & install feeds
        run: |
          cd immortalwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          cd immortalwrt
          make defconfig

      - name: Download packages
        run: |
          cd immortalwrt
          make download -j$(nproc) || true

      - name: Build firmware
        run: |
          cd immortalwrt
          make -j$(nproc) V=s

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find immortalwrt/bin/targets -type f \( -name "*.bin" -o -name "*.manifest" \) -print0 | xargs -0 -I{} cp {} artifacts/
          ls -la artifacts/

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-zbt-we826-q
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14
