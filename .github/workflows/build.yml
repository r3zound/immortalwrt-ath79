name: Build EdgeLink EL-953

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'release type (only effective when build succeeds)'
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - release
  # No push trigger: builds only on manual Run, to avoid running on every code change.

permissions:
  contents: write

jobs:
  build:
    name: Build firmware
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            libelf-dev python3-distutils quilt cpio xxd

      - name: Update feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          make defconfig

      - name: Download packages
        run: |
          make download -j$(nproc) || true

      - name: Build firmware
        run: |
          # OpenWrt 21.02 + Ubuntu 22.04 GCC 11 trips on legacy host tools (squashfs3.0)
          # with -Werror=format. Strip -Werror from host rules before build.
          find . -type f \( -name "*.mk" -o -name "Makefile" \) -path "*/include/*" -o -path "*/rules.mk" | while read f; do
            sed -i 's/-Werror[^ ]*//g' "$f" 2>/dev/null || true
          done
          sed -i 's/-Werror[^ ]*//g' rules.mk 2>/dev/null || true
          sed -i 's/-Werror[^ ]*//g' include/host-build.mk 2>/dev/null || true
          make -j$(nproc) V=s

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          find bin/targets -type f \( -name "*.bin" -o -name "*.manifest" \) -print0 \
            | xargs -0 -I{} cp {} artifacts/ 2>/dev/null || true
          ls -la artifacts/ 2>/dev/null || echo "no artifacts"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: immortalwrt-edgelink-el-953
          path: artifacts/
          if-no-files-found: warn
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'workflow_dispatch' && inputs.release_type == 'release' && success()
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: immortalwrt-edgelink-el-953
          path: artifacts

      - name: List artifacts
        run: ls -la artifacts

      - name: Create GitHub release (draft, prerelease)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}-${{ github.sha }}
          name: 'EdgeLink EL-953 firmware (build ${{ github.sha }})'
          body: |
            Auto-generated from workflow run ${{ github.run_id }}.

            **Flashing:** via Breed -> choose `*edgelink_el-953-squashfs-sysupgrade.bin`
            **Rollback:** restore `full.bin` in Breed
          draft: true
          prerelease: true
          files: |
            artifacts/*.bin
            artifacts/*.manifest
          fail_on_unmatched_files: true
