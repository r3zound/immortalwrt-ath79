name: Build WE826-Q firmware with frpc

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: '基线 zbt_we826-q sysupgrade.bin 直链 (https)'
        required: true
        type: string
      frpc_server:
        description: 'frp 服务端地址'
        required: true
        default: '8.148.70.135'
        type: string
      frpc_port:
        description: 'frp 服务端端口'
        required: true
        default: '7000'
        type: string
      frpc_token:
        description: 'frp token (留空则刷机后在 LuCI 服务->frpc 里填)'
        required: false
        default: ''
        type: string
      luci_proxy:
        description: 'LuCI 通道 name:type:remote_port:local_ip:local_port'
        required: false
        default: 'we826q-luci:tcp:20061:192.168.2.1:80'
        type: string
      ssh_proxy:
        description: 'SSH 通道 name:type:remote_port:local_ip:local_port'
        required: false
        default: 'we826q-ssh:tcp:20062:192.168.2.1:22'
        type: string
      mirror:
        description: 'ImmortalWrt 21.02.7 软件源'
        required: false
        default: 'https://downloads.immortalwrt.org/releases/21.02.7/packages/mips_24kc'
        type: string
      publish_release:
        description: '构建成功后是否创建草稿 Release'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  build:
    name: Repack firmware with frpc
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xz-utils python3 ca-certificates curl

      - name: Download baseline firmware
        run: |
          mkdir -p baseline out
          curl -fL --retry 3 --max-time 900 -o baseline/zbt_we826-q-sysupgrade.bin "${{ inputs.base_url }}"
          ls -l baseline/

      - name: Download frpc packages
        run: |
          cd baseline
          curl -fL --retry 3 -O "${{ inputs.mirror }}/packages/frpc_0.51.2-1_mips_24kc.ipk"
          curl -fL --retry 3 -O "${{ inputs.mirror }}/luci/luci-app-frpc_git-21.175.36114-ad08c8e_all.ipk"
          curl -fL --retry 3 -O "${{ inputs.mirror }}/luci/luci-i18n-frpc-zh-cn_git-23.090.62029-650e6d2_all.ipk"
          ls -l

      - name: Repack with frpc
        run: |
          python3 scripts/we826q/build_frpc_firmware.py \
            --base baseline/zbt_we826-q-sysupgrade.bin \
            --out out/immortalwrt-ath79-generic-zbt_we826-q-squashfs-sysupgrade.bin \
            --work "$RUNNER_TEMP/we826q" \
            --frpc-ipk baseline/frpc_0.51.2-1_mips_24kc.ipk \
            --luci-ipk baseline/luci-app-frpc_git-21.175.36114-ad08c8e_all.ipk \
            --i18n-ipk baseline/luci-i18n-frpc-zh-cn_git-23.090.62029-650e6d2_all.ipk \
            --server '${{ inputs.frpc_server }}' \
            --port '${{ inputs.frpc_port }}' \
            --token '${{ inputs.frpc_token }}' \
            --proxy '${{ inputs.luci_proxy }}' \
            --proxy '${{ inputs.ssh_proxy }}' \
            --strict-symlinks

      - name: Verify output
        run: |
          cd out
          ls -lah
          sha256sum -c *.sha256
          python3 - <<'PY'
          import struct
          d = open('immortalwrt-ath79-generic-zbt_we826-q-squashfs-sysupgrade.bin','rb').read()
          hdr = d[:512]
          off = struct.unpack_from('>I', hdr, 0x88)[0]
          size = struct.unpack_from('>I', hdr, 0x8C)[0]
          print('rootfs_offset=0x%X rootfs_size=%d magic=%r' % (off, size, d[off:off+4]))
          assert d[off:off+4] in (b'hsqs', b'hsqt'), 'rootfs 不是 squashfs'
          assert off + size <= 0xff0000, '超出 firmware 分区'
          print('镜像头校验通过')
          PY

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: we826q-frpc-firmware
          path: out/
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    needs: build
    if: ${{ inputs.publish_release == true && success() }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: we826q-frpc-firmware
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: we826q-frpc-${{ github.run_number }}
          name: WE826-Q firmware with frpc (build ${{ github.run_number }})
          draft: true
          prerelease: true
          files: artifacts/*
